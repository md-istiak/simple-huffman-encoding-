<!DOCTYPE html>
<html>
<head>
<title>Huffman Encoder</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
.container{background:white;padding:30px;width:450px;border-radius:10px;box-shadow:0 4px 15px #ccc;text-align:center}
h1{margin-bottom:25px}
textarea{width:100%;height:100px;margin:10px 0;padding:10px;box-sizing:border-box;resize:none}
button{padding:10px 30px;background:#222;color:white;border:0;border-radius:5px;cursor:pointer;margin:10px}
button:hover{background:#444}
</style>
</head>
<body>
<div class="container">
<h1>Huffman Encoder</h1>
<textarea id="input" placeholder="Enter text"></textarea>
<button onclick="encode()">Encode</button>
<textarea id="output" placeholder="Encoded binary" readonly></textarea>
</div>
<script>
class Node{
constructor(c,f,l=null,r=null){this.c=c;this.f=f;this.l=l;this.r=r}
}
function encode(){
let text=document.getElementById("input").value;
if(!text)return;
let f={};
for(let c of text)f[c]=(f[c]||0)+1;
let n=[];
for(let c in f)n.push(new Node(c,f[c]));
while(n.length>1){
n.sort((a,b)=>a.f-b.f);
let a=n.shift(),b=n.shift();
n.push(new Node(null,a.f+b.f,a,b));
}
let codes={};
function makeCode(x,code){
if(x.c!==null){codes[x.c]=code||"0";return}
makeCode(x.l,code+"0");
makeCode(x.r,code+"1");
}
makeCode(n[0],"");
let result="";
for(let c of text)result+=codes[c];
document.getElementById("output").value=result;
}
</script>
</body>
</html>
